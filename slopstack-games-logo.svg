    <use href="#pad" fill="#3a0a8a" transform="translate(0,39) scale(1,0.46) rotate(45)"></use>
    <use href="#pad" fill="#3a0a8a" transform="translate(0,36) scale(1,0.46) rotate(45)"></use>
    <use href="#pad" fill="#3a0a8a" transform="translate(0,33) scale(1,0.46) rotate(45)"></use>
    <use href="#pad" fill="#3a0a8a" transform="translate(0,30) scale(1,0.46) rotate(45)"></use>
    <use href="#pad" fill="#3a0a8a" transform="translate(0,27) scale(1,0.46) rotate(45)"></use>
    <use href="#pad" fill="#3a0a8a" transform="translate(0,24) scale(1,0.46) rotate(45)"></use>
    <use href="#pad" fill="#3a0a8a" transform="translate(0,21) scale(1,0.46) rotate(45)"></use>
    <use href="#pad" fill="#3a0a8a" transform="translate(0,18) scale(1,0.46) rotate(45)"></use>
    <use href="#pad" fill="#3a0a8a" transform="translate(0,15) scale(1,0.46) rotate(45)"></use>
    <use href="#pad" fill="#560bad" transform="translate(0,12) scale(1,0.46) rotate(45)"></use>
    <use href="#pad" fill="#560bad" transform="translate(0,9) scale(1,0.46) rotate(45)"></use>
    <use href="#pad" fill="#560bad" transform="translate(0,6) scale(1,0.46) rotate(45)"></use>
    <use href="#pad" fill="#560bad" transform="translate(0,3) scale(1,0.46) rotate(45)"></use>
  </g>
  <g transform="scale(1,0.46) rotate(45)">
    <g opacity="0.85"><use href="#pad" fill="url(#topB)"></use></g>
    <g opacity="0.8"><use href="#pad" fill="none" stroke="#6de8ff" stroke-width="3.6" vector-effect="non-scaling-stroke"></use></g>
    <g opacity="0.08"><use href="#sheen" fill="white"></use></g>
    <g opacity="0.6"><use href="#face" fill="#6de8ff"></use></g>
  </g>
</g>

<!-- TOP CONTROLLER — rotated 3deg -->
<g transform="translate(528, 322) rotate(3)">
  <g opacity="0.65">
    <use href="#pad" fill="#0077a8" transform="translate(0,60) scale(1,0.46) rotate(45)"></use>
    <use href="#pad" fill="#0077a8" transform="translate(0,57) scale(1,0.46) rotate(45)"></use>
    <use href="#pad" fill="#0077a8" transform="translate(0,54) scale(1,0.46) rotate(45)"></use>
