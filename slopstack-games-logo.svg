    <use href="#pad" fill="#0077a8" transform="translate(0,42) scale(1,0.46) rotate(45)"></use>
    <use href="#pad" fill="#0077a8" transform="translate(0,39) scale(1,0.46) rotate(45)"></use>
    <use href="#pad" fill="#0077a8" transform="translate(0,36) scale(1,0.46) rotate(45)"></use>
