    <use href="#pad" fill="#0077a8" transform="translate(0,27) scale(1,0.46) rotate(45)"></use>
    <use href="#pad" fill="#0077a8" transform="translate(0,24) scale(1,0.46) rotate(45)"></use>
    <use href="#pad" fill="#0077a8" transform="translate(0,21) scale(1,0.46) rotate(45)"></use>
    <use href="#pad" fill="#0077a8" transform="translate(0,18) scale(1,0.46) rotate(45)"></use>
    <use href="#pad" fill="#0077a8" transform="translate(0,15) scale(1,0.46) rotate(45)"></use>
    <use href="#pad" fill="#0096c7" transform="translate(0,12) scale(1,0.46) rotate(45)"></use>
    <use href="#pad" fill="#0096c7" transform="translate(0,9) scale(1,0.46) rotate(45)"></use>
