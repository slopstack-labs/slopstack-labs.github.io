<svg width="1040" height="1040" viewBox="0 0 1040 1040" role="img" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="max-width: 1040px; display: block; margin-inline: auto;">
<title>Slopstack Games — sloppy isometric stacked controllers</title>
<desc>Three isometric glassy game controllers stacked crookedly and close together</desc>
<defs>
  <linearGradient id="topA" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#3ecfcf"></stop>
    <stop offset="100%" stop-color="#6a4fd4"></stop>
  </linearGradient>
  <linearGradient id="topB" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#9b5de5"></stop>
    <stop offset="100%" stop-color="#4361ee"></stop>
  </linearGradient>
  <linearGradient id="topC" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#5e60ce"></stop>
    <stop offset="100%" stop-color="#3a0ca3"></stop>
  </linearGradient>
  <radialGradient id="bgFade" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#a8b4ff" stop-opacity="0.5"></stop>
    <stop offset="100%" stop-color="#a8b4ff" stop-opacity="0"></stop>
  </radialGradient>

  <!-- Generic gamepad body, drawn flat and centred on 0,0 -->
  <path id="pad" d="M -110,-85 H 110 C 165,-85 185,-62 195,-22 L 222,82 C 232,124 205,146 172,135 C 145,126 130,98 110,72 H -110 C -130,98 -145,126 -172,135 C -205,146 -232,124 -222,82 L -195,-22 C -185,-62 -165,-85 -110,-85 Z"></path>

  <!-- Face details: d-pad, four face buttons, two sticks -->
  <g id="face">
    <rect x="-152" y="-24" width="68" height="22" rx="5"></rect>
    <rect x="-129" y="-47" width="22" height="68" rx="5"></rect>
    <circle cx="118" cy="-38" r="12"></circle>
    <circle cx="118" cy="16" r="12"></circle>
    <circle cx="91" cy="-11" r="12"></circle>
    <circle cx="145" cy="-11" r="12"></circle>
    <circle cx="-52" cy="38" r="24"></circle>
    <circle cx="52" cy="38" r="24"></circle>
  </g>

  <!-- Gloss sheen over the upper half of the body -->
  <path id="sheen" d="M -110,-85 H 110 C 165,-85 185,-62 195,-22 L 200,0 H -200 L -195,-22 C -185,-62 -165,-85 -110,-85 Z"></path>
</defs>

<circle cx="520" cy="520" r="400" fill="url(#bgFade)"></circle>

<!-- BOTTOM CONTROLLER — shifted right, rotated 6deg -->
<g transform="translate(556, 640) rotate(6)">
  <g opacity="0.75">
    <use href="#pad" fill="#1a0870" transform="translate(0,60) scale(1,0.46) rotate(45)"></use>
    <use href="#pad" fill="#1a0870" transform="translate(0,57) scale(1,0.46) rotate(45)"></use>
    <use href="#pad" fill="#1a0870" transform="translate(0,54) scale(1,0.46) rotate(45)"></use>
    <use href="#pad" fill="#1a0870" transform="translate(0,51) scale(1,0.46) rotate(45)"></use>
    <use href="#pad" fill="#1a0870" transform="translate(0,48) scale(1,0.46) rotate(45)"></use>
    <use href="#pad" fill="#1a0870" transform="translate(0,45) scale(1,0.46) rotate(45)"></use>
    <use href="#pad" fill="#1a0870" transform="translate(0,42) scale(1,0.46) rotate(45)"></use>
    <use href="#pad" fill="#1a0870" transform="translate(0,39) scale(1,0.46) rotate(45)"></use>
    <use href="#pad" fill="#1a0870" transform="translate(0,36) scale(1,0.46) rotate(45)"></use>
    <use href="#pad" fill="#1a0870" transform="translate(0,33) scale(1,0.46) rotate(45)"></use>
    <use href="#pad" fill="#1a0870" transform="translate(0,30) scale(1,0.46) rotate(45)"></use>
    <use href="#pad" fill="#1a0870" transform="translate(0,27) scale(1,0.46) rotate(45)"></use>
    <use href="#pad" fill="#1a0870" transform="translate(0,24) scale(1,0.46) rotate(45)"></use>
    <use href="#pad" fill="#1a0870" transform="translate(0,21) scale(1,0.46) rotate(45)"></use>
    <use href="#pad" fill="#1a0870" transform="translate(0,18) scale(1,0.46) rotate(45)"></use>
    <use href="#pad" fill="#1a0870" transform="translate(0,15) scale(1,0.46) rotate(45)"></use>
    <use href="#pad" fill="#2d0f8f" transform="translate(0,12) scale(1,0.46) rotate(45)"></use>
    <use href="#pad" fill="#2d0f8f" transform="translate(0,9) scale(1,0.46) rotate(45)"></use>
    <use href="#pad" fill="#2d0f8f" transform="translate(0,6) scale(1,0.46) rotate(45)"></use>
    <use href="#pad" fill="#2d0f8f" transform="translate(0,3) scale(1,0.46) rotate(45)"></use>
  </g>
  <g transform="scale(1,0.46) rotate(45)">
    <g opacity="0.85"><use href="#pad" fill="url(#topC)"></use></g>
    <g opacity="0.7"><use href="#pad" fill="none" stroke="#6de8ff" stroke-width="3.6" vector-effect="non-scaling-stroke"></use></g>
    <g opacity="0.07"><use href="#sheen" fill="white"></use></g>
    <g opacity="0.55"><use href="#face" fill="#6de8ff"></use></g>
  </g>
</g>

<!-- MIDDLE CONTROLLER — shifted left, rotated -5deg -->
<g transform="translate(484, 480) rotate(-5)">
  <g opacity="0.75">
    <use href="#pad" fill="#3a0a8a" transform="translate(0,60) scale(1,0.46) rotate(45)"></use>
