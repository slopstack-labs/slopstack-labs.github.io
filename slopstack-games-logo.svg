  </g>
  <g transform="scale(1,0.46) rotate(45)">
    <g opacity="0.9"><use href="#pad" fill="url(#topA)"></use></g>
    <g opacity="0.9"><use href="#pad" fill="none" stroke="#6de8ff" stroke-width="4" vector-effect="non-scaling-stroke"></use></g>
    <g opacity="0.13"><use href="#sheen" fill="white"></use></g>
    <g opacity="0.75"><use href="#face" fill="#e6fbff"></use></g>
